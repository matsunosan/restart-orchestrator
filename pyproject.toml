[project]
name = "restart-orchestrator"
version = "0.20.0b1"
description = "Remote staged restart of Linux/macOS/Windows hosts with app autostart control and Zabbix status"
requires-python = ">=3.10"

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "B904"]  # Depends() in FastAPI arguments; raise without from in HTTP handlers

[tool.pytest.ini_options]
testpaths = ["tests"]
